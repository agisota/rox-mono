# ============================================================
# WEIGHTS
# Matching Berkeley Mono's full weight axis:
#   100 Thin · 200 ExtraLight · 300 Light · 350 SemiLight
#   400 Regular · 500 Medium · 600 SemiBold · 700 Bold
#   800 ExtraBold · 900 Black
# ============================================================

[buildPlans.RoxMonoTypeface.weights.Thin]
shape = 100
menu = 100
css = 100

[buildPlans.RoxMonoTypeface.weights.ExtraLight]
shape = 200
menu = 200
css = 200

[buildPlans.RoxMonoTypeface.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.RoxMonoTypeface.weights.SemiLight]
shape = 350
menu = 350
css = 350

[buildPlans.RoxMonoTypeface.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.RoxMonoTypeface.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.RoxMonoTypeface.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.RoxMonoTypeface.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.RoxMonoTypeface.weights.ExtraBold]
shape = 800
menu = 800
css = 800

[buildPlans.RoxMonoTypeface.weights.Black]
shape = 900
menu = 900
css = 900

# ============================================================
# WIDTHS
#   90 = SemiCondensed → shape 540  (600 × 0.90)
#   100 = Normal       → shape 600
#
# Condensed (480) was dropped in v2.1.0 — it sat narrower than
# Iosevka's own Normal (500) and read as squashed. If it comes
# back, widen the steps to 600 / 555 / 510 rather than reusing
# the old value.
# ============================================================

[buildPlans.RoxMonoTypeface.widths.SemiCondensed]
shape = 540
menu = 4
css = "semi-condensed"

[buildPlans.RoxMonoTypeface.widths.Normal]
shape = 600
menu = 5
css = "normal"

# ============================================================
# SLOPES
# ============================================================

[buildPlans.RoxMonoTypeface.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.RoxMonoTypeface.slopes.Italic]
angle = 11.8
shape = "italic"
menu = "italic"
css = "italic"

# ============================================================
# METRICS
# ============================================================

[buildPlans.RoxMonoTypeface.metricOverride]
xHeight = 520
cap = 690
ascender = 740
sb = 85

accentWidth = 182
accentClearance = 76
accentHeight = 162
accentStackOffset = 208

leading = 1250
parenSize = 860
dotSize = 'blend(weight, [100, 110], [400, 125], [900, 150])'
periodSize = 140

essRatio = 1.03
essRatioUpper = 1.03
essRatioLower = 1.03
essRatioQuestion = 1.03
archDepth = 152
smallArchDepth = 157

# ============================================================
# NL VARIANT (No Ligatures)
# Identical to RoxMonoTypeface except ligature substitutions are
# disabled — for apps that cannot toggle ligatures themselves
# (e.g. Xcode).
# ============================================================

[buildPlans.RoxMonoTypefaceNL]
family = "Rox Mono Typeface NL"
spacing = "normal"
serifs = "sans"
noCvSs = true
noLigation = true
exportGlyphNames = false

weights.inherits = "buildPlans.RoxMonoTypeface"
widths.inherits  = "buildPlans.RoxMonoTypeface"
slopes.inherits  = "buildPlans.RoxMonoTypeface"

[buildPlans.RoxMonoTypefaceNL.variants]
inherits = "buildPlans.RoxMonoTypeface"

[buildPlans.RoxMonoTypefaceNL.metricOverride]
xHeight = 520
cap = 690
ascender = 740
sb = 85

accentWidth = 182
accentClearance = 76
accentHeight = 162
accentStackOffset = 208

leading = 1250
parenSize = 860
dotSize = 'blend(weight, [100, 110], [400, 125], [900, 150])'
periodSize = 140

essRatio = 1.03
essRatioUpper = 1.03
essRatioLower = 1.03
essRatioQuestion = 1.03
archDepth = 152
smallArchDepth = 157

# ============================================================
# TERM VARIANT
# Identical to RoxMonoTypeface except spacing = "term", which
# fixes arrow and box-drawing rendering in terminals (kitty,
# Ghostty, etc.) that don't honour the normal cell width.
# ============================================================

[buildPlans.RoxMonoTypefaceTerm]
family = "Rox Mono Typeface Term"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = true

weights.inherits = "buildPlans.RoxMonoTypeface"
widths.inherits  = "buildPlans.RoxMonoTypeface"
slopes.inherits  = "buildPlans.RoxMonoTypeface"

[buildPlans.RoxMonoTypefaceTerm.variants]
inherits = "buildPlans.RoxMonoTypeface"

[buildPlans.RoxMonoTypefaceTerm.metricOverride]
xHeight = 520
cap = 690
ascender = 740
sb = 85

accentWidth = 182
accentClearance = 76
accentHeight = 162
accentStackOffset = 208

leading = 1250
parenSize = 860
dotSize = 'blend(weight, [100, 110], [400, 125], [900, 150])'
periodSize = 140

essRatio = 1.03
essRatioUpper = 1.03
essRatioLower = 1.03
essRatioQuestion = 1.03
archDepth = 152
smallArchDepth = 157
# ============================================================
# WEB VARIANT
# Same design, trimmed character set. The full build carries
# Greek, Cyrillic, braille, CJK and rare math, which pushes each
# WOFF2 past 500 KB — fine for a desktop install, not for every
# page load. Ranges below cover Latin, punctuation, currency,
# arrows, math operators and the box/block glyphs.
# ============================================================

[buildPlans.RoxMonoTypefaceWeb]
family = "Rox Mono Typeface"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

weights.inherits = "buildPlans.RoxMonoTypeface"
widths.inherits  = "buildPlans.RoxMonoTypeface"
slopes.inherits  = "buildPlans.RoxMonoTypeface"

[buildPlans.RoxMonoTypefaceWeb.variants]
inherits = "buildPlans.RoxMonoTypeface"

[buildPlans.RoxMonoTypefaceWeb.subset.include]
ranges = [
  [32, 126],      # Basic Latin
  [160, 255],     # Latin-1 Supplement
  [256, 383],     # Latin Extended-A
  [768, 879],     # Combining Diacritical Marks
  [8192, 8303],   # General Punctuation
  [8352, 8383],   # Currency Symbols
  [8592, 8703],   # Arrows
  [8704, 8959],   # Mathematical Operators
  [9472, 9599],   # Box Drawing
  [9600, 9631],   # Block Elements
  [9632, 9727],   # Geometric Shapes
]

[buildPlans.RoxMonoTypefaceWeb.metricOverride]
xHeight = 520
cap = 690
ascender = 740
sb = 85

accentWidth = 182
accentClearance = 76
accentHeight = 162
accentStackOffset = 208

leading = 1250
parenSize = 860
dotSize = 'blend(weight, [100, 110], [400, 125], [900, 150])'
periodSize = 140

essRatio = 1.03
essRatioUpper = 1.03
essRatioLower = 1.03
essRatioQuestion = 1.03
archDepth = 152
smallArchDepth = 157
