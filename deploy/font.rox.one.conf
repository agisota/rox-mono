server {
    listen 80;
    listen 443 ssl http2;
    server_name font.rox.one;

    ssl_certificate     /etc/ssl/font.rox.one/fullchain.pem;
    ssl_certificate_key /etc/ssl/font.rox.one/privkey.pem;

    root /var/www/font.rox.one;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(woff2|png|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
